<!doctype html>
<!-- data-theme default kept in sync with DEFAULT_THEME_ID in src/lib/data/themes.ts -->
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="A catalog of Claude Code skills for AI-assisted software engineering, testing, cloud platforms, databases, and more." />
		<link rel="stylesheet" id="lily-theme" data-lily-theme-picker="theme" href="/themes/light.css" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<script>
			// Apply the stored theme choice before first paint, so returning
			// visitors never see a flash of the wrong theme. Mirrors
			// ThemePicker.svelte, a thin wrapper around Lily's theme-picker
			// helper — it persists a slug, not a computed value, so this
			// script only ever sets a data-* attribute and swaps the
			// stylesheet href, never CSS values directly.
			(function () {
				try {
					var theme = localStorage.getItem('skills-for-ai-theme');
					if (theme) {
						document.documentElement.dataset.theme = theme;
						var link = document.getElementById('lily-theme');
						if (link) link.href = '/themes/' + theme + '.css';
					}
				} catch (e) {
					// localStorage unavailable (private browsing, disabled storage) — ignore.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
